name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      # once a month, or when started by hand on main, the pins move to the
      # latest Filestash, go-oidc and base images before anything gets tested
      REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: ${{ env.REFRESH }}

      - name: Update pins
        if: env.REFRESH == 'true'
        run: sh scripts/bump.sh && git diff

      - name: Unit tests
        run: make test

      # builds the image that gets published below
      - name: End-to-end tests
        run: make e2e

      - name: Commit pins
        if: env.REFRESH == 'true'
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Filestash, go-oidc and base images"
          git push origin HEAD:main

      - name: Image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ env.REFRESH != 'true' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ env.REFRESH == 'true' }}
            type=semver,pattern={{version}}

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag filestash-oidc "$tag"
            docker push "$tag"
          done
